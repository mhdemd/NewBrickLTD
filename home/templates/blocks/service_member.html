{% load static %}
{% load wagtailimages_tags %}
<div class="col-xl-3 col-lg-6 col-md-6 wow fadeInUp" data-wow-delay="100ms;">
    <div class="team-one__single">
        <div class="team-one__img-box">
            <div class="team-one__img">
                <img class="team-one__image" src="{% image value.image fill-270x384 as member_img_url %}{{ member_img_url.url }}" alt="{{ value.name }}">
                <div class="team-one__shape-1">
                    <img src="{% static 'assets/images/shapes/team-one-shape-1.png' %}" alt="">
                </div>
                <div class="team-one__icon">
                    <a href="#"><span class="fas fa-share-alt"></span></a>
                    <div class="team-one__social-box">
                        <ul class="list-unstyled team-one__social">
                            <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                            <li><a href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                            <li><a href="#"><i class="fab fa-instagram"></i></a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="team-one__content">
                <h3 class="team-one__name"><a href="{{ value.profile_link }}">{{ value.name }}</a></h3>
                <p class="team-one__subtitle">{{ value.job_title }}</p>
            </div>
        </div>
    </div>
</div>
