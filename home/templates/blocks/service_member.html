{% load static %}
{% load custom_tags %}
{% load wagtailimages_tags %}

<div class="col-xl-3 col-lg-6 col-md-6 wow fadeInUp" data-wow-delay="100ms;">
    <div class="team-one__single">
        <div class="team-one__img-box">
            <div class="team-one__img">
                <img loading="lazy" src="{% image value.image fill-270x384 format-webp as member_img_url %}{{ member_img_url.url }}" alt="">

                <div class="team-one__shape-1">
                    <img loading="lazy" src="{% static 'assets/images/shapes/team-one-shape-1.png' %}" alt="">
                </div>
            </div>
            <div class="team-one__content">
                <h3 class="team-one__name">
                    <a href="{% url 'service_detail' value.name|striptags|slugify %}">{{ value.name }}</a>

                </h3>
            </div>
        </div>
    </div>
</div>
